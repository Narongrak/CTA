events {}

http {
    upstream central_auth {
        server central-auth:3000;
    }

    upstream web_app {
        server web-app-1:3001;
    }

    server {
        listen 80;

        # Central Authentication Service
        location = /auth {
            return 301 /auth/;
        }

        location /auth/ {
            proxy_pass http://central_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web App Backend API
        location /api/ {
            proxy_pass http://web_app/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backward compatibility for /lab
        location /lab/ {
            return 301 /;
        }

        # Main Grade Academic Web Application
        location / {
            proxy_pass http://web_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
