events {}

http {
    upstream central_auth {
        server central-auth:3000;
    }

    upstream web_app_1 {
        server web-app-1:3001;
    }

    server {
        listen 80;

        location = /auth {
            return 301 /auth/;
        }

        location /auth/ {
            proxy_pass http://central_auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /lab {
            return 301 /lab/;
        }

        location /lab/ {
            proxy_pass http://web_app_1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 301 /lab/;
        }
    }
}
